SetupWindow.Title={title} - Extension setup
SetupWindow.Label1.HelpText=
SetupWindow.Label1.Label.1={title} must ensure that all necessary requirements are met.\nDo you wish to continue?
SetupWindow.Label1.Label.2=Searching for installed LibreOffice extensions...
SetupWindow.Label1.Label.3=Your LibreOffice extension requirements are met...
SetupWindow.Label1.Label.4=You must install the following LibreOffice extensions:
SetupWindow.Label1.Label.5=Searching for installed Java JDK...
SetupWindow.Label1.Label.6=Your version {version} of the Java JDK meets the requirements...
SetupWindow.Label1.Label.7=Your Java JDK version {version} does not meet the requirements, which specify a minimum version of {minimum}...
SetupWindow.Label1.Label.8=A Java JDK is present, but its version cannot be determined. This could mean that it is a version earlier than version 8. Therefore, you must install and configure a Java JDK of version {minimum} or later...
SetupWindow.Label1.Label.9=You must enable Java in the LibreOffice options to allow verification of the correct version of your Java JDK...
SetupWindow.Label1.Label.10=Your computer does not appear to have a Java JDK installed. You must install at least version {minimum} of the Java JDK, then enable this Java JDK in the LibreOffice advanced options...
SetupWindow.Label1.Label.11=Creation of the database...
SetupWindow.Label1.Label.12=The database already exists...
SetupWindow.Label1.Label.12=The creation of the database went smoothly....
SetupWindow.Label1.Label.14=The creation of the database could not be completed.
SetupWindow.Label1.Label.15=Searching for installed Python packages...
SetupWindow.Label1.Label.16=The requirements for Python packages are met:
SetupWindow.Label1.Label.17=You must install the following Python packages:
SetupWindow.Label1.Label.18=Installing missing Python packages...
SetupWindow.Label1.Label.19=Successful installation of the following Python packages:
SetupWindow.Label1.Label.20=Installation of the following packages failed. Do you want to try again?
SetupWindow.Label1.Label.21=Thank you, everything is perfect, you must restart LibreOffice for these changes to take effect...
SetupWindow.Label1.Label.22=Thank you, everything is already perfect, you may continue...
SetupWindow.Label1.Label.23=These required extensions are missing. They must be installed to continue:
SetupWindow.Label1.Label.24=The required Java JDK is missing. You cannot proceed without installing and/or activating a Java JDK with a minimum version of:
SetupWindow.Label1.Label.25=The database could not be created. It is impossible to continue.
