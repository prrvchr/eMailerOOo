SetupWindow.Title={title} - Configuration de l'extension
SetupWindow.Label1.HelpText=
SetupWindow.Label1.Label.1={title} doit s'assurer que toutes les exigences nécessaires sont remplies.\nSouhaitez-vous continuer ?
SetupWindow.Label1.Label.2=Recherche des extensions LibreOffice installées...
SetupWindow.Label1.Label.3=Vos besoins en matière d'extension LibreOffice sont satisfaits...
SetupWindow.Label1.Label.4=Vous devez installer les extensions LibreOffice suivantes:
SetupWindow.Label1.Label.5=Recherche du JDK Java installé...
SetupWindow.Label1.Label.6=Votre version {version} du JDK Java répond aux exigences...
SetupWindow.Label1.Label.7=Votre version {version} du JDK Java ne répond pas aux exigences, qui stipulent une version minimale de {minimum}...
SetupWindow.Label1.Label.8=Un JDK Java est présent, mais sa version ne peut pas être déterminée. Cela pourrait signifier qu'il s'agit d'une version antérieure à la version 8. Par conséquent, vous devez installer et configurer un JDK Java en version {minimum} ou ultérieure...
SetupWindow.Label1.Label.9=Vous devez activer Java dans les options de LibreOffice pour permettre la vérification de la version correcte de votre JDK Java...
SetupWindow.Label1.Label.10=Votre ordinateur ne semble pas avoir de JDK Java installé. Vous devez installer une version du JDK Java {minimum} minimum., puis activer ce JDK Java dans les options avancées de LibreOffice...
SetupWindow.Label1.Label.11=Creation de la base de données...
SetupWindow.Label1.Label.12=La base de données existe déjà...
SetupWindow.Label1.Label.13=La création de la base de données s'est bien déroulée...
SetupWindow.Label1.Label.14=La création de la base de données n'a pas pu aboutir...
SetupWindow.Label1.Label.15=Recherche des paquets Python présents...
SetupWindow.Label1.Label.16=Les exigences relatives aux paquets Python sont satisfaites:
SetupWindow.Label1.Label.17=Vous devez installer les paquets Python suivants:
SetupWindow.Label1.Label.18=Installation des paquets Python manquants...
SetupWindow.Label1.Label.19=Installation réussie des paquets Python suivants:
SetupWindow.Label1.Label.20=L'installation des paquets suivants a échoué. Voulez-vous réessayer ?
SetupWindow.Label1.Label.21=Merci, tout est parfait, vous devez redémarrer LibreOffice pour que ces modifications prennent effet...
SetupWindow.Label1.Label.22=Merci, tout est déja parfait, vous pouvez continuer...
SetupWindow.Label1.Label.23=Ces extensions requises sont manquantes. Elles doivent être installées pour continuer:
SetupWindow.Label1.Label.24=Le JDK Java requis est absent. Vous ne pouvez pas continuer sans installer et/ou activer un JDK Java dont la version minimale est:
SetupWindow.Label1.Label.25=La base de données n'a pas pu être créée. Il est impossible de continuer.
